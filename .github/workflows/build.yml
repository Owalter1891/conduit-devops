name: CI, publish and deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Let main finish deploying before a newer run can deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate infrastructure configuration
        run: npm run infra:validate

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'

      - name: Validate Terraform
        working-directory: infra/aws
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Test deployment input validation
        run: python3 -m unittest discover -s infra/aws -p 'test_*.py'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Start integration database
        run: docker compose --env-file /dev/null -p conduit-ci-integration -f compose.test.yaml up -d --wait --wait-timeout 60

      - name: Run integration tests
        run: npm run test:integration

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Show integration database logs on failure
        if: failure()
        run: docker compose --env-file /dev/null -p conduit-ci-integration -f compose.test.yaml logs --no-color --tail 100

      - name: Remove integration database
        if: always()
        run: docker compose --env-file /dev/null -p conduit-ci-integration -f compose.test.yaml down --volumes --remove-orphans

  publish:
    name: Publish Docker image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image name and commit tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image can be pulled
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker pull "$IMAGE"

      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Published image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  verify-deployment:
    name: Verify published deployment
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      # Pin the deployment to the exact artifact produced by this workflow run.
      APP_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
      COMPOSE_FILE: compose.production.yaml
      COMPOSE_PROJECT_NAME: conduit-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      APP_BIND_ADDRESS: 127.0.0.1
      APP_PORT: '8080'
      # Disposable credentials, used only inside this temporary runner.
      POSTGRES_PASSWORD: smoke-test-database-only
      JWT_KEY: smoke-test-signing-key-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start published image and PostgreSQL
        run: docker compose --env-file /dev/null up -d --no-build --pull always --wait --wait-timeout 120

      - name: Smoke-test deployment
        run: npm run test:smoke

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose --env-file /dev/null ps -a
          docker compose --env-file /dev/null logs --no-color --tail 100

      - name: Remove temporary deployment and database
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans

  deploy-aws:
    name: Deploy to AWS
    needs: [publish, verify-deployment]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      AWS_HOST: ${{ vars.AWS_HOST }}
      APP_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy the verified image over SSH
        id: deploy
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ vars.AWS_SSH_KNOWN_HOSTS }}
        run: python3 infra/aws/deploy.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Smoke-test public HTTPS deployment
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Allow time for the first HTTPS certificate to be issued.
          for attempt in $(seq 1 30); do
            echo "Public smoke-test attempt $attempt/30"
            if npm run test:smoke; then
              echo "Deployed and smoke-tested: $SMOKE_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
