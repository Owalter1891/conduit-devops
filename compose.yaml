services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit_dev
      POSTGRES_DB: conduit_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: