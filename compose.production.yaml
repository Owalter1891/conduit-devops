name: conduit-production

services:
  app:
    build: .
    image: conduit-devops:local
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY in .env.production}
      PROD_DB_USERNAME: conduit
      PROD_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      PROD_DB_NAME: conduit
      PROD_DB_HOSTNAME: db
      PROD_DB_DIALECT: postgres
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/tags', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: conduit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
